trainer:
  max_epochs: 50
  log_every_n_steps: 10
  accelerator: cpu  # Changed from 'gpu' to 'cpu'
  devices: 1
  default_root_dir: logs/Morocco-FTW
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val_loss
        mode: min
        save_top_k: 3
        save_last: true
        filename: "{epoch}-{val_loss:.2f}"
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val_loss
        patience: 15
        mode: min

model:
  class_path: ftw.trainers.CustomSemanticSegmentationTask
  init_args:
    class_weights: [0.0, 1.165, 1.835]
    loss: "ce" 
    model: "unet"
    backbone: "efficientnet-b3"
    weights: true
    patch_weights: false
    in_channels: 8 #Stacked window a&b
    num_classes: 3 #background, field, boundries
    num_filters: 64
    ignore_index: 0 #ignore background pixels
    lr: 1e-3
    patience: 100

data:
  class_path: ftw.datamodules.FTWDataModule
  init_args:
    batch_size: 4  # Reduced batch size for CPU training
    num_workers: 0  # Reduced for CPU
    train_countries:
      - morocco
    val_countries:
      - morocco
    test_countries:
      - morocco
    temporal_options: "stacked"
    load_boundaries: true
  dict_kwargs:
    root: "C:/Users/qin.xu/github/ftw-baselines/data/ftw"

seed_everything: 42